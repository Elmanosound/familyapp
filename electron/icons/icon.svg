<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- House icon (centered) -->
  <g transform="translate(256,256)" fill="white">
    <!-- Roof -->
    <polygon points="0,-120 130,0 -130,0" opacity="0.95"/>
    <!-- Door + walls -->
    <rect x="-95" y="10"  width="190" height="120" rx="6" opacity="0.95"/>
    <!-- Door opening -->
    <rect x="-30" y="60"  width="60"  height="70"  rx="6" fill="url(#bg)"/>
    <!-- Left window -->
    <rect x="-80" y="30"  width="38"  height="38"  rx="6" fill="url(#bg)" opacity="0.8"/>
    <!-- Right window -->
    <rect x="42"  y="30"  width="38"  height="38"  rx="6" fill="url(#bg)" opacity="0.8"/>
    <!-- Chimney -->
    <rect x="60"  y="-140" width="24" height="60"  rx="4" opacity="0.85"/>
  </g>
</svg>
